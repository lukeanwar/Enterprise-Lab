<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .seg-label { font-size: 13px; font-weight: 600; fill: #333; }
    .subnet { font-size: 11px; fill: #666; }
    .vm-label { font-size: 12px; font-weight: 600; fill: #111; }
    .vm-ip { font-size: 10px; fill: #555; }
    .title { font-size: 18px; font-weight: 700; fill: #111; }
    .caption { font-size: 11px; fill: #777; }
    .seg-mgmt { fill: #E8F4FD; stroke: #2E86C1; }
    .seg-corp { fill: #E8F8E8; stroke: #28A745; }
    .seg-srv  { fill: #FFF4E0; stroke: #E67E22; }
    .seg-dmz  { fill: #FDECEA; stroke: #C0392B; }
    .vm-box   { fill: #fff; stroke: #333; stroke-width: 1.2; }
    .fw-box   { fill: #FEF9E7; stroke: #B7950B; stroke-width: 2; }
    .internet { fill: #EBF5FB; stroke: #1F618D; stroke-width: 1.5; }
    .link     { stroke: #555; stroke-width: 1.5; fill: none; }
    .link-dash { stroke: #555; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  </style>

  <text x="490" y="32" text-anchor="middle" class="title">Enterprise-Lab — Network Topology</text>
  <text x="490" y="50" text-anchor="middle" class="caption">pfSense firewall with four segmented internal networks. Default deny between segments.</text>

  <!-- Internet -->
  <rect x="420" y="75" width="140" height="46" rx="8" class="internet"/>
  <text x="490" y="95" text-anchor="middle" class="vm-label">Internet</text>
  <text x="490" y="111" text-anchor="middle" class="vm-ip">via macOS host NAT</text>

  <!-- Link Internet -> FW -->
  <line x1="490" y1="121" x2="490" y2="155" class="link"/>
  <text x="500" y="142" class="caption">WAN</text>

  <!-- Firewall -->
  <rect x="380" y="155" width="220" height="60" rx="10" class="fw-box"/>
  <text x="490" y="180" text-anchor="middle" class="vm-label">pfSense FW01</text>
  <text x="490" y="198" text-anchor="middle" class="vm-ip">5 interfaces — WAN + 4 LAN</text>

  <!-- Links to segments -->
  <line x1="430" y1="215" x2="160" y2="295" class="link"/>
  <line x1="465" y1="215" x2="380" y2="295" class="link"/>
  <line x1="515" y1="215" x2="600" y2="295" class="link"/>
  <line x1="550" y1="215" x2="820" y2="295" class="link"/>

  <!-- MGMT segment -->
  <rect x="40" y="290" width="240" height="170" rx="10" class="seg-mgmt" stroke-width="1.5"/>
  <text x="160" y="312" text-anchor="middle" class="seg-label">MGMT</text>
  <text x="160" y="328" text-anchor="middle" class="subnet">10.10.10.0/24 — gw .254</text>

  <rect x="80" y="350" width="160" height="60" rx="6" class="vm-box"/>
  <text x="160" y="372" text-anchor="middle" class="vm-label">KALI01</text>
  <text x="160" y="388" text-anchor="middle" class="vm-ip">10.10.10.10</text>
  <text x="160" y="402" text-anchor="middle" class="caption">Attacker / jump box</text>

  <!-- CORP segment -->
  <rect x="300" y="290" width="240" height="280" rx="10" class="seg-corp" stroke-width="1.5"/>
  <text x="420" y="312" text-anchor="middle" class="seg-label">CORP</text>
  <text x="420" y="328" text-anchor="middle" class="subnet">10.10.20.0/24 — gw .254</text>

  <rect x="340" y="350" width="160" height="60" rx="6" class="vm-box"/>
  <text x="420" y="372" text-anchor="middle" class="vm-label">WIN-DC01</text>
  <text x="420" y="388" text-anchor="middle" class="vm-ip">10.10.20.10</text>
  <text x="420" y="402" text-anchor="middle" class="caption">Domain Controller + DNS</text>

  <rect x="340" y="425" width="160" height="60" rx="6" class="vm-box"/>
  <text x="420" y="447" text-anchor="middle" class="vm-label">WIN-CLI01</text>
  <text x="420" y="463" text-anchor="middle" class="vm-ip">10.10.20.20</text>
  <text x="420" y="477" text-anchor="middle" class="caption">Windows 11 client</text>

  <rect x="340" y="500" width="160" height="55" rx="6" class="vm-box"/>
  <text x="420" y="520" text-anchor="middle" class="vm-label">WIN-CLI02 (opt.)</text>
  <text x="420" y="536" text-anchor="middle" class="vm-ip">10.10.20.21</text>

  <!-- SERVERS segment -->
  <rect x="560" y="290" width="240" height="170" rx="10" class="seg-srv" stroke-width="1.5"/>
  <text x="680" y="312" text-anchor="middle" class="seg-label">SERVERS</text>
  <text x="680" y="328" text-anchor="middle" class="subnet">10.10.30.0/24 — gw .254</text>

  <rect x="600" y="350" width="160" height="60" rx="6" class="vm-box"/>
  <text x="680" y="372" text-anchor="middle" class="vm-label">LIN-SIEM01</text>
  <text x="680" y="388" text-anchor="middle" class="vm-ip">10.10.30.10</text>
  <text x="680" y="402" text-anchor="middle" class="caption">Ubuntu 24.04 + Wazuh</text>

  <!-- DMZ segment -->
  <rect x="820" y="290" width="140" height="280" rx="10" class="seg-dmz" stroke-width="1.5"/>
  <text x="890" y="312" text-anchor="middle" class="seg-label">DMZ</text>
  <text x="890" y="328" text-anchor="middle" class="subnet">10.10.40.0/24</text>
  <text x="890" y="343" text-anchor="middle" class="subnet">gw .254 — no egress</text>

  <rect x="836" y="360" width="108" height="55" rx="6" class="vm-box"/>
  <text x="890" y="380" text-anchor="middle" class="vm-label">LIN-WEB01</text>
  <text x="890" y="395" text-anchor="middle" class="vm-ip">10.10.40.10</text>
  <text x="890" y="409" text-anchor="middle" class="caption">DVWA</text>

  <rect x="836" y="430" width="108" height="55" rx="6" class="vm-box"/>
  <text x="890" y="450" text-anchor="middle" class="vm-label">META01</text>
  <text x="890" y="465" text-anchor="middle" class="vm-ip">10.10.40.20</text>
  <text x="890" y="479" text-anchor="middle" class="caption">Metasploitable2</text>

  <!-- Legend / flow rules -->
  <rect x="40" y="600" width="900" height="80" rx="8" fill="#FAFAFA" stroke="#DDD"/>
  <text x="60" y="622" class="seg-label">Inter-segment policy</text>
  <text x="60" y="643" class="caption">MGMT → CORP/SERVERS/DMZ: allowed (admin + attacker access)   ·   CORP → SERVERS: agent + DNS only   ·   CORP → DMZ: denied</text>
  <text x="60" y="660" class="caption">DMZ → anywhere: denied (containment)   ·   MGMT/CORP/SERVERS → WAN: HTTP/HTTPS/DNS/NTP only   ·   Everything else: default deny</text>
</svg>
